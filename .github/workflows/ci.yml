name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Verify repository contract
        run: python3 scripts/verify_repository.py
      - name: Verify accepted M3 evidence
        run: python3 scripts/run_m3_experiment.py verify --input benchmarks/raw/m3-cache-policies-20260803 --check
      - name: Verify accepted M4 evidence
        run: python3 scripts/run_m4_experiment.py verify --input benchmarks/raw/m4-bf16-gemv-20260803 --check
      - name: Test evidence tooling
        run: python3 -m unittest discover -s scripts/tests -v

  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint all targets
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test all targets
        run: cargo test --workspace --all-targets --locked
      - name: Smoke-test the closed M4 evidence protocol
        run: |
          cargo build --locked -p runnel-kernels --bin runnel-kernel-bench \
            -p runnel --bin runnel-m4-model-check
          m4_smoke="$(mktemp -d /dev/shm/runnel-m4-smoke.XXXXXX)"
          test "$(stat -c %a "$m4_smoke")" = 700
          target/debug/runnel-kernel-bench cases > "$m4_smoke/cases.jsonl"
          target/debug/runnel-kernel-bench correctness > "$m4_smoke/kernel.jsonl"
          target/debug/runnel-m4-model-check > "$m4_smoke/model.jsonl"
          PYTHONPATH=scripts python3 - "$m4_smoke" <<'PY'
          import pathlib
          import sys
          import run_m4_experiment as evidence

          root = pathlib.Path(sys.argv[1])
          parse = lambda name: evidence.parse_jsonl_bytes(
              (root / name).read_bytes(), name
          )
          evidence.validate_cases(parse("cases.jsonl"))
          evidence.validate_correctness(
              [*parse("kernel.jsonl"), *parse("model.jsonl")]
          )
          PY
      - name: Test scalar-only kernel and runtime build
        run: |
          scalar_target="$(mktemp -d /dev/shm/runnel-scalar-target.XXXXXX)"
          test "$(stat -c %a "$scalar_target")" = 700
          CARGO_TARGET_DIR="$scalar_target" \
            cargo clippy -p runnel-kernels --all-targets --no-default-features \
              --locked -- -D warnings
          CARGO_TARGET_DIR="$scalar_target" \
            cargo test -p runnel-kernels --all-targets --no-default-features --locked
          CARGO_TARGET_DIR="$scalar_target" \
            cargo clippy -p runnel-runtime --all-targets --no-default-features \
              --locked -- -D warnings
          CARGO_TARGET_DIR="$scalar_target" \
            cargo test -p runnel-runtime --all-targets --no-default-features --locked
          test "$(find "$scalar_target" -type f \
            \( -name bf16_gemv.o -o -name librunnel_kernels.a \) -print -quit)" = ""
      - name: Check default-feature cross target stays scalar-only
        run: |
          rustup target add aarch64-unknown-linux-gnu
          cross_target="$(mktemp -d /dev/shm/runnel-cross-target.XXXXXX)"
          test "$(stat -c %a "$cross_target")" = 700
          CARGO_TARGET_DIR="$cross_target" \
            cargo check -p runnel-kernels --target aarch64-unknown-linux-gnu --locked
          test "$(find "$cross_target" -type f \
            \( -name bf16_gemv.o -o -name librunnel_kernels.a \) -print -quit)" = ""
      - name: Check public documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --locked

  native-sanitizers:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and run native ABI harness with ASan and UBSan
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:strict_string_checks=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          sanitizer_dir="$(mktemp -d /dev/shm/runnel-native-sanitizer.XXXXXX)"
          test "$(stat -c %a "$sanitizer_dir")" = 700
          cc -std=c11 -O1 -g3 -fno-omit-frame-pointer \
            -fsanitize=address,undefined -fno-sanitize-recover=all \
            -Wall -Wextra -Wpedantic -Werror -Wconversion -Wshadow \
            -Wstrict-prototypes -Wmissing-prototypes -Wformat=2 -Wundef \
            -Wwrite-strings -ffp-contract=off -fno-fast-math \
            -Icrates/runnel-kernels/include \
            crates/runnel-kernels/native/bf16_gemv.c \
            crates/runnel-kernels/tests/c/abi_sanitizer.c \
            -pthread -lm -o "$sanitizer_dir/runnel-kernels-abi-sanitizer"
          "$sanitizer_dir/runnel-kernels-abi-sanitizer"

  oracle:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install the closed oracle dependency set
        run: python -m pip install --disable-pip-version-check --no-deps -r oracle/requirements.txt
      - name: Verify committed oracle vectors
        run: python -m oracle.generate --check
      - name: Verify committed adapter-v2 oracle vectors
        run: python -m oracle.generate --check --spec fixtures/tiny-v2/spec.json
      - name: Test the independent oracle
        run: python -m unittest discover -s oracle/tests -v

  visual-evidence-candidate:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install exact Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.11"
      - name: Install locked raster renderer
        run: >-
          python3 -m pip install --disable-pip-version-check --no-deps
          --only-binary=:all: --require-hashes
          -r scripts/visual-requirements.txt
      - name: Build the documented CLI surfaces
        run: >-
          cargo build --locked
          -p runnel --bin runnel --bin runnel-m4-model-check
          -p runnel-sim --bin runnel-cache-sim
      - name: Test renderer and security contract
        env:
          RUNNEL_REQUIRE_VISUAL_DEPS: "1"
        run: python3 -m unittest scripts.tests.test_generate_visual_evidence -v
      - name: Capture candidate evidence
        run: |
          set -euo pipefail
          umask 077
          CANDIDATE_PATH="$RUNNER_TEMP/runnel-visual-evidence-$GITHUB_SHA"
          test ! -e "$CANDIDATE_PATH"
          python3 scripts/generate_visual_evidence.py capture \
            --repo-root "$GITHUB_WORKSPACE" \
            --output "$CANDIDATE_PATH" \
            --repository "$GITHUB_REPOSITORY" \
            --revision "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT"
      - name: Verify complete candidate artifact
        env:
          RUNNEL_REQUIRE_VISUAL_DEPS: "1"
          RUNNEL_VISUAL_EVIDENCE_CANDIDATE: ${{ runner.temp }}/runnel-visual-evidence-${{ github.sha }}
        run: |
          set -euo pipefail
          CANDIDATE_PATH="$RUNNER_TEMP/runnel-visual-evidence-$GITHUB_SHA"
          python3 scripts/generate_visual_evidence.py verify \
            --input "$CANDIDATE_PATH" \
            --expected-revision "$GITHUB_SHA"
          python3 -m unittest scripts.tests.test_generate_visual_evidence -v
      - name: Upload immutable candidate artifact
        id: upload-visual-evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-evidence-candidate-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/runnel-visual-evidence-${{ github.sha }}
          if-no-files-found: error
          include-hidden-files: false
          compression-level: 0
          retention-days: 7
      - name: Record hosted custody
        env:
          ARTIFACT_DIGEST: ${{ steps.upload-visual-evidence.outputs.artifact-digest }}
          ARTIFACT_URL: ${{ steps.upload-visual-evidence.outputs.artifact-url }}
        run: |
          {
            printf '%s\n' '## Visual-evidence candidate'
            printf '\n'
            printf -- '- Source: %s\n' "$GITHUB_SHA"
            printf -- '- Artifact SHA-256: %s\n' "$ARTIFACT_DIGEST"
            printf -- '- Candidate URL: %s\n' "$ARTIFACT_URL"
            printf '\n%s\n' 'Candidate only; independent review and explicit GO are required before adoption.'
          } >> "$GITHUB_STEP_SUMMARY"
