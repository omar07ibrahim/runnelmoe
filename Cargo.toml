[workspace]
members = [
    "crates/runnel-cli",
    "crates/runnel-fixture",
    "crates/runnel-format",
    "crates/runnel-runtime",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
authors = ["Omar Ibrahim <31526072+omar07ibrahim@users.noreply.github.com>"]
license = "Apache-2.0"
repository = "https://github.com/omar07ibrahim/runnelmoe"

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.20"
thiserror = "2.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.dev]
debug = 1
incremental = false

[profile.test]
debug = 1
incremental = false
