[package]
name = "runnel"
description = "Local CLI for the RunnelMoE reference runtime"
default-run = "runnel"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "runnel"
path = "src/main.rs"

[[bin]]
name = "runnel-m4-model-check"
path = "src/bin/runnel-m4-model-check.rs"

[dependencies]
clap.workspace = true
runnel-fixture = { path = "../runnel-fixture" }
runnel-format = { path = "../runnel-format" }
runnel-kernels = { path = "../runnel-kernels", default-features = false }
runnel-runtime = { path = "../runnel-runtime" }
runnel-store = { path = "../runnel-store" }
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tokio.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
